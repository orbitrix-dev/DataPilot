# Alembic configuration. The database URL is NOT set here: migrations connect with
# DP_MIGRATION_DATABASE_URL, falling back to DP_DATABASE_URL (both read by app/core/config.py).
# Run from backend/:
#   uv run alembic upgrade head                                  # apply all pending migrations
#   uv run alembic downgrade -1                                  # roll back one migration
#   uv run alembic current                                       # show the database's revision
#   uv run alembic check                                         # fail if models and migrations differ
#   uv run alembic revision --autogenerate --rev-id 0001 -m "…"  # new migration; always review it
#   uv run alembic upgrade head --sql                            # print the SQL instead of running it

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Readable, ordered file names: 0001_initial_schema.py, 0002_….py (pass --rev-id).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
