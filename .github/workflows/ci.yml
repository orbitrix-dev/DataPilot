# Continuous integration for pull requests and main.
#
# Jobs (use these names as required status checks in branch protection):
#   backend   locked install, PostgreSQL readiness, Alembic upgrade + drift check, pytest, Ruff lint + format
#   frontend  production build from the committed lockfile; fails if the build modifies tracked files
#
# No repository secrets are used. The PostgreSQL service is an ephemeral container on the runner; its passwords
# are throwaway CI-only values, never real credentials. As in every environment, migrations run as the owner
# (datapilot) and the application and tests connect as the least-privilege runtime user (datapilot_app).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token: read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: ci-only-throwaway  # ephemeral container, reachable only from this job
          POSTGRES_DB: datapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DP_ENV: test
      DP_DATABASE_URL: postgresql+psycopg://datapilot_app:ci-only-app@localhost:5432/datapilot
      DP_MIGRATION_DATABASE_URL: postgresql+psycopg://datapilot:ci-only-throwaway@localhost:5432/datapilot
      DP_TEST_DATABASE_URL: postgresql+psycopg://datapilot_app:ci-only-app@localhost:5432/datapilot_test
      DP_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://datapilot:ci-only-throwaway@localhost:5432/datapilot_test
      PGHOST: localhost
      PGUSER: datapilot
      PGPASSWORD: ci-only-throwaway
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Wait for PostgreSQL, create the test database and the runtime user
        run: |
          for attempt in $(seq 1 30); do
            pg_isready -d datapilot && break
            sleep 2
          done
          pg_isready -d datapilot
          psql -d datapilot -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE datapilot_test" \
            -c "CREATE ROLE datapilot_app LOGIN PASSWORD 'ci-only-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" \
            -c "GRANT CONNECT ON DATABASE datapilot, datapilot_test TO datapilot_app"

      # Alembic arrives with the database-foundation branch; until then these steps are skipped.
      - name: Alembic upgrade head
        if: hashFiles('backend/alembic.ini') != ''
        run: uv run alembic upgrade head

      - name: Alembic check (models vs migrations)
        if: hashFiles('backend/alembic.ini') != ''
        run: uv run alembic check

      - name: Tests
        run: uv run pytest

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (from package-lock.json)
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Build must not modify tracked files
        run: git diff --exit-code --stat
