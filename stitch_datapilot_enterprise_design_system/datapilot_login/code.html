<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — DataPilot</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

globalThis.tailwind.config = {

  theme: {

        'light-outline-variant': '#E2E8F0',
        'dark-primary': '#818CF8',
        'dark-on-primary': '#0F172A',
        'dark-primary-container': '#1E1B4B',
        'dark-on-primary-container': '#E0E7FF',
        'dark-secondary': '#A5B4FC',
        'dark-on-secondary': '#0F172A',
        'dark-surface': '#0F172A',
        'dark-on-surface': '#F8FAFC',
        'dark-surface-variant': '#1E293B',
        'dark-on-surface-variant': '#94A3B8',
        'dark-surface-container-low': '#0F172A',
        'dark-surface-container': '#1E293B',
        'dark-surface-container-high': '#334155',

      borderRadius: {

        'gutter-xs': '4px',

        'headline-lg': ['24px', { lineHeight: '32px', letterSpacing: '-0.4px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'title-lg': ['16px', { lineHeight: '24px', letterSpacing: '-0.1px', fontWeight: '600' }],
        'title-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '600' }],
        'body-lg': ['15px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '400' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '400' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '500' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.1px', fontWeight: '500' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.3px', fontWeight: '600' }],

        'surface-enter': '220ms',
        'surface-exit': '140ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.16, 1, 0.3, 1)',

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-surface-variant text-light-on-surface font-body antialiased">

  <div class="min-h-[1024px] flex flex-col justify-between px-4 py-8 md:py-12" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Brand Header -->
    <header class="w-full max-w-md mx-auto flex items-center justify-center mb-6">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded bg-light-primary text-light-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">analytics</span>
        </div>
        <span data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface">DataPilot</span>
      </div>
    </header>

    <!-- Centered Auth Card -->
    <main class="w-full max-w-md mx-auto">
      <div class="bg-light-surface border border-light-outline-variant rounded-md p-6 md:p-8 flex flex-col gap-gutter-lg">
        <div class="text-center">
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Sign in to your workspace</h1>
          <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant mt-1.5 text-pretty">
            Access your company metrics, data health checks, and automated reports.
          </p>
        </div>

        <!-- SSO Options -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter-sm">
          <button type="button" class="inline-flex items-center justify-center gap-2 px-3 py-2 rounded border border-light-outline bg-light-surface text-light-on-surface hover:bg-light-surface-container-low transition-colors duration-state-change">
            <span class="material-symbols-outlined text-[18px] text-light-primary" aria-hidden="true">domain</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Microsoft SSO</span>
          </button>
          <button type="button" class="inline-flex items-center justify-center gap-2 px-3 py-2 rounded border border-light-outline bg-light-surface text-light-on-surface hover:bg-light-surface-container-low transition-colors duration-state-change">
            <span class="material-symbols-outlined text-[18px] text-light-primary" aria-hidden="true">shield_person</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">Google Workspace</span>
          </button>
        </div>

        <div class="relative flex items-center justify-center">
          <div class="border-t border-light-outline-variant w-full"></div>
          <span data-design-text-token="body-sm" class="px-3 bg-light-surface font-body text-body-sm text-light-on-surface-variant">or</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" novalidate class="flex flex-col gap-gutter-md">
          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Work email</span>
            <input id="login-email" type="email" value="elena.vance@acmeglobal.com" placeholder="you@company.com" required class="w-full px-3 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <span id="login-email-error" role="alert" data-design-text-token="body-sm" class="hidden font-body text-body-sm text-error">Enter a valid work email address.</span>
          </label>

          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label for="login-password" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Password</label>
              <a href="../auth-forgot-password/ForgotPassword.html" data-design-text-token="label-md" class="font-label text-label-md text-light-primary hover:text-light-secondary">Forgot password?</a>
            </div>
            <div class="relative flex items-center">
              <input id="login-password" type="password" value="••••••••••••" placeholder="Enter your password" required class="w-full pl-3 pr-10 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
              <button type="button" onclick="togglePassword()" aria-label="Show or hide password" class="absolute right-2.5 p-1 text-light-on-surface-variant hover:text-light-on-surface">
                <span id="pw-icon" class="material-symbols-outlined text-[18px]" aria-hidden="true">visibility</span>
              </button>
            </div>
            <span id="login-pw-error" role="alert" data-design-text-token="body-sm" class="hidden font-body text-body-sm text-error">Password must be at least 8 characters.</span>
          </div>

          <label class="inline-flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="rounded-sm border-light-outline text-light-primary focus:ring-light-primary">
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Keep me signed in for 30 days</span>
          </label>

          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full mt-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded bg-light-primary text-light-on-primary hover:bg-light-secondary transition-colors duration-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Sign in</span>
          </button>
        </form>

        <p data-design-text-token="body-sm" class="text-center font-body text-body-sm text-light-on-surface-variant">
          New to DataPilot?
          <a href="../auth-create-account/CreateAccount.html" class="font-label text-label-md text-light-primary hover:text-light-secondary">Create an account</a>
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto mt-8 text-center flex flex-col gap-1">
      <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">SOC 2 Type II certified · 256-bit TLS encryption</p>
    </footer>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('pw-icon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.textContent = isHidden ? 'visibility_off' : 'visibility';
    }
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email');
      const pw = document.getElementById('login-password');
      const emailErr = document.getElementById('login-email-error');
      const pwErr = document.getElementById('login-pw-error');
      let valid = true;
      if (!email.value.includes('@')) {
        emailErr.classList.remove('hidden');
        email.classList.add('border-error');
        valid = false;
      } else {
        emailErr.classList.add('hidden');
        email.classList.remove('border-error');
      }
      if (pw.value.length < 8) {
        pwErr.classList.remove('hidden');
        pw.classList.add('border-error');
        valid = false;
      } else {
        pwErr.classList.add('hidden');
        pw.classList.remove('border-error');
      }
    }
  </script>


</body></html>
