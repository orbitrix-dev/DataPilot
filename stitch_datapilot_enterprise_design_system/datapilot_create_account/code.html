  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-surface-variant text-light-on-surface font-body antialiased">

  <div class="min-h-[1024px] flex flex-col justify-between px-4 py-8 md:py-12" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="w-full max-w-md mx-auto flex items-center justify-center mb-6">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded bg-light-primary text-light-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">analytics</span>
        </div>
        <span data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface">DataPilot</span>
      </div>
    </header>

    <main class="w-full max-w-md mx-auto">
      <div class="bg-light-surface border border-light-outline-variant rounded-md p-6 md:p-8 flex flex-col gap-gutter-lg">
        <div class="text-center">
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Create your account</h1>
          <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant mt-1.5 text-pretty">
            Start connecting your business tools in minutes. No engineering setup required.
          </p>
        </div>

        <form onsubmit="validateSignup(event)" novalidate class="flex flex-col gap-gutter-md">
          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Full name</span>
            <input id="signup-name" type="text" placeholder="Elena Vance" required class="w-full px-3 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <span id="name-err" role="alert" data-design-text-token="body-sm" class="hidden font-body text-body-sm text-error">Please enter your full name.</span>
          </label>

          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Work email</span>
            <input id="signup-email" type="email" placeholder="you@company.com" required class="w-full px-3 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <span id="email-err" role="alert" data-design-text-token="body-sm" class="hidden font-body text-body-sm text-error">Enter a valid business email address.</span>
          </label>

          <div class="flex flex-col gap-1.5">
            <label for="signup-pw" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Password</label>
            <div class="relative flex items-center">
              <input id="signup-pw" type="password" placeholder="Create a strong password" oninput="updateStrength(this.value)" class="w-full pl-3 pr-10 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
              <button type="button" onclick="togglePw()" aria-label="Show or hide password" class="absolute right-2.5 p-1 text-light-on-surface-variant hover:text-light-on-surface">
                <span id="signup-pw-icon" class="material-symbols-outlined text-[18px]" aria-hidden="true">visibility</span>
              </button>
            </div>
            <!-- Strength Meter -->
            <div class="grid grid-cols-3 gap-1.5 pt-1">
              <div id="bar-1" class="h-1 rounded-full bg-light-surface-container-high"></div>
              <div id="bar-2" class="h-1 rounded-full bg-light-surface-container-high"></div>
              <div id="bar-3" class="h-1 rounded-full bg-light-surface-container-high"></div>
            </div>
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Use at least 12 characters with a mix of letters and numbers.</span>
          </div>

          <label class="inline-flex items-start gap-2.5 cursor-pointer pt-1">
            <input type="checkbox" checked class="mt-0.5 rounded-sm border-light-outline text-light-primary focus:ring-light-primary">
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">
              I agree to the <a href="#terms" class="text-light-primary underline">Terms of Service</a> and <a href="#privacy" class="text-light-primary underline">Privacy Policy</a>.
            </span>
          </label>

          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full mt-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded bg-light-primary text-light-on-primary hover:bg-light-secondary transition-colors duration-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Create account</span>
          </button>
        </form>

        <p data-design-text-token="body-sm" class="text-center font-body text-body-sm text-light-on-surface-variant">
          Already have an account?
          <a href="../auth-login/Login.html" class="font-label text-label-md text-light-primary hover:text-light-secondary">Sign in</a>
        </p>
      </div>
    </main>

    <footer class="w-full max-w-md mx-auto mt-8 text-center">
      <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">14-day full-access trial · No credit card required</p>
    </footer>
  </div>

  <script>
    function togglePw() {
      const i = document.getElementById('signup-pw');
      const ic = document.getElementById('signup-pw-icon');
      const show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      ic.textContent = show ? 'visibility_off' : 'visibility';
    }
    function updateStrength(val) {
      const b1 = document.getElementById('bar-1');
      const b2 = document.getElementById('bar-2');
      const b3 = document.getElementById('bar-3');
      [b1, b2, b3].forEach(b => b.className = 'h-1 rounded-full bg-light-surface-container-high');
      if (val.length >= 4) b1.classList.replace('bg-light-surface-container-high', 'bg-warning');
      if (val.length >= 8) {
        b1.classList.replace('bg-warning', 'bg-light-primary');
        b2.classList.replace('bg-light-surface-container-high', 'bg-light-primary');
      }
      if (val.length >= 12 && /\d/.test(val)) {
        [b1, b2, b3].forEach(b => b.className = 'h-1 rounded-full bg-success');
      }
    }
    function validateSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name');
      const email = document.getElementById('signup-email');
      document.getElementById('name-err').classList.toggle('hidden', name.value.trim().length > 1);
      document.getElementById('email-err').classList.toggle('hidden', email.value.includes('@'));
    }
  </script>


</body></html>
