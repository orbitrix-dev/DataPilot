  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface-variant text-light-on-surface font-body antialiased">

  <div class="min-h-[1024px] flex flex-col justify-between px-4 py-8 md:py-12" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="w-full max-w-md mx-auto flex items-center justify-center mb-6">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded bg-light-primary text-light-on-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">analytics</span>
        </div>
        <span data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface">DataPilot</span>
      </div>
    </header>

    <main class="w-full max-w-md mx-auto">
      <div class="bg-light-surface border border-light-outline-variant rounded-md p-6 md:p-8 flex flex-col gap-gutter-lg">
        <div class="text-center flex flex-col items-center gap-2">
          <div class="w-11 h-11 rounded-full bg-light-primary-container text-light-on-primary-container flex items-center justify-center">
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">lock_reset</span>
          </div>
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Reset your password</h1>
          <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant text-pretty">
            Enter the work email tied to your account and we will send you a secure reset link.
          </p>
        </div>

        <form id="forgot-form" onsubmit="sendReset(event)" class="flex flex-col gap-gutter-md">
          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Work email</span>
            <input id="reset-email" type="email" placeholder="you@company.com" required class="w-full px-3 py-2 rounded border border-light-outline bg-light-surface text-body-md text-light-on-surface placeholder:text-light-on-surface-variant focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </label>

          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded bg-light-primary text-light-on-primary hover:bg-light-secondary transition-colors duration-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Send reset link</span>
          </button>
        </form>

        <!-- Confirmation Banner (shown after submit) -->
        <div id="reset-sent-banner" role="status" class="hidden p-4 rounded bg-success-container text-on-success-container flex items-start gap-3">
          <span class="material-symbols-outlined text-[20px] shrink-0 mt-0.5" aria-hidden="true">mark_email_read</span>
          <div>
            <p data-design-text-token="label-md" class="font-label text-label-md">Reset link sent</p>
            <p data-design-text-token="body-sm" class="font-body text-body-sm mt-0.5">Check your inbox for a link valid for 30 minutes.</p>
          </div>
        </div>

        <a href="../auth-login/Login.html" class="inline-flex items-center justify-center gap-1.5 font-label text-label-md text-light-on-surface-variant hover:text-light-on-surface">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
          <span>Back to sign in</span>
        </a>
      </div>
    </main>

    <footer class="w-full max-w-md mx-auto mt-8 text-center">
      <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Need help? Contact support@datapilot.io</p>
    </footer>
  </div>

  <script>
    function sendReset(e) {
      e.preventDefault();
      document.getElementById('reset-sent-banner').classList.remove('hidden');
    }
  </script>


</body></html>
